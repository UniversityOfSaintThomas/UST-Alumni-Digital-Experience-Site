# Sample portal widgets for scratch orgs ("widgets" dataset; also included by the "dev" dataset).
#
#   cci task run load_sample_data --dataset widgets --org dev        # load
#   cci task run delete_sample_widgets --org dev                     # remove them again (then edit and reload)
#
# Every widget is named "[Sample] ..." so delete_sample_widgets can find exactly these and nothing else.
# Page contexts (UST_Portal_Zone_Placement__c) are NOT created here: config_dev step 1.6 seeds the real ones
# (home, alumni_directory__c, plus the layout zones banner and above_footer). The widgets use those, plus
# deliberate edge cases (inactive, zone mismatch, unregistered page).
#
# Which persona sees what (personas are in datasets/alumni/alumni.recipe.yml):
#   everyone ........ the All Pages banner/above-footer widgets, the hero, the two-page sidebar widget
#   smp1 Jordan ..... recent grads (Class Year 2021 AND connection Alumni), young-alumni communications
#   smp2 Morgan ..... donors, volunteers, Location 1, and the Placeholder college/athletic filters
#   smp3 Casey ...... parents
#   smp4 Riley ...... only widgets with no filters (no Alumni Directory record)
#   a guest ......... only widgets with no filters

- plugin: snowfakery.standard_plugins.Salesforce

# ---- Layout zones: appear on every page ------------------------------------------------------------------
- object: UST_Portal_Widget__c
  fields:
    Name: "[Sample] Banner - all pages, everyone (static)"
    Component_Name__c: ust_static_content
    Zone__c: banner
    Page_Context__c: all
    Is_Active__c: true
    Sort_Order__c: 10
    Description__c: Layout banner zone with page context All Pages. Everyone sees it on every page.
    Content_CSS_Class__c: ust-content-muted
    Static_Content_Header__c: "Welcome, {{First_Name|friend}}"
    Static_Content__c: <p>This banner is on every page because its page context is <strong>All Pages</strong>.</p>

- object: UST_Portal_Widget__c
  fields:
    Name: "[Sample] Above footer - all pages (centered, buttons)"
    Component_Name__c: ust_static_content
    Zone__c: above_footer
    Page_Context__c: all
    Is_Active__c: true
    Sort_Order__c: 10
    Description__c: Layout zone above the footer with two buttons (portal link and external link).
    Content_CSS_Class__c: ust-content-centered
    Static_Content_Header__c: Questions about your record?
    Static_Content__c: <p>Contact the Alumni Relations office and we will help you update it.</p>
    Button_Placement__c: Below
    Buttons_JSON__c: >-
      {"version":1,"buttons":[
      {"id":"b1","label":"Open the directory","type":"portal","url":"/alumni-directory","newTab":false,"style":"brand","align":"center"},
      {"id":"b2","label":"Visit stthomas.edu","type":"external","url":"https://www.stthomas.edu","newTab":true,"style":"outline-brand","align":"center"}]}

