# ---- Edge cases for the editor and the page-context picker -----------------------------------------------
- object: UST_Portal_Widget__c
  fields:
    Name: "[Sample] EDGE inactive - never shown"
    Component_Name__c: ust_static_content
    Zone__c: body
    Page_Context__c: home
    Is_Active__c: false
    Sort_Order__c: 1
    Description__c: Is Active is false, so it must not appear anywhere.
    Static_Content_Header__c: You should never see this
    Static_Content__c: <p>Inactive widget.</p>

- object: UST_Portal_Widget__c
  fields:
    Name: "[Sample] EDGE zone mismatch (body zone on a page that has none)"
    Component_Name__c: ust_static_content
    Zone__c: body
    Page_Context__c: alumni_directory__c
    Is_Active__c: true
    Sort_Order__c: 10
    Description__c: Alumni Directory has no body zone. The page-context picker should warn, and nothing renders.
    Static_Content_Header__c: Not rendered
    Static_Content__c: <p>No body zone on this page.</p>

- object: UST_Portal_Widget__c
  fields:
    Name: "[Sample] EDGE unregistered page context (giving)"
    Component_Name__c: ust_static_content
    Zone__c: body
    Page_Context__c: giving
    Is_Active__c: true
    Sort_Order__c: 10
    Description__c: Legacy value "giving" is not a registered page. The picker should flag it as unregistered.
    Static_Content_Header__c: Giving page widget
    Static_Content__c: <p>Legacy page context.</p>
