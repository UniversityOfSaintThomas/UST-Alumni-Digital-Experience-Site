- object: UST_Portal_Widget__c
  fields:
    Name: "[Sample] Home body - Card Grid (6 cards, 3 columns, green bar)"
    Component_Name__c: ust_card_grid
    Zone__c: body
    Page_Context__c: home
    Is_Active__c: true
    Sort_Order__c: 27
    Description__c: Card Grid on a Gray panel. Cards are listed out of title order on purpose, to show that Sort Order wins. Three link kinds (site page, external, mailto) and one card with no link. No pictures, so it works without an S3 bucket.
    Section_Background__c: gray
    Grid_Columns__c: "3"
    Card_Bottom_Bar__c: green
    Static_Content_Header__c: How You Can Make an Impact
    Static_Content__c: <p>Six ways to stay connected and give back.</p>
  friends:
    - object: UST_Portal_Widget_Item__c
      fields:
        Name: Refer a Student
        Widget__c:
          reference: UST_Portal_Widget__c
        Sort_Order__c: 10
        Card_Text__c: Know someone who would thrive at St. Thomas? Share your Tommie experience with them.
        Link_URL__c: /alumni-directory
    - object: UST_Portal_Widget_Item__c
      fields:
        Name: Become a Mentor
        Widget__c:
          reference: UST_Portal_Widget__c
        Sort_Order__c: 20
        Card_Text__c: Share what you know with a student starting out.
        Link_URL__c: https://www.stthomas.edu/alumni
        Open_In_New_Tab__c: true
    - object: UST_Portal_Widget_Item__c
      fields:
        Name: Hire a Tommie
        Widget__c:
          reference: UST_Portal_Widget__c
        Sort_Order__c: 30
        Card_Text__c: Post a job or internship for St. Thomas students and alumni.
        Link_URL__c: mailto:alumni@stthomas.edu
    - object: UST_Portal_Widget_Item__c
      fields:
        Name: Volunteer with St. Thomas
        Widget__c:
          reference: UST_Portal_Widget__c
        Sort_Order__c: 40
        Card_Text__c: Give your time to events, programs and your class.
    - object: UST_Portal_Widget_Item__c
      fields:
        Name: Join the Alumni Engagement Board
        Widget__c:
          reference: UST_Portal_Widget__c
        Sort_Order__c: 50
        Card_Text__c: Help guide how the university stays connected with alumni.
        Link_URL__c: /
    - object: UST_Portal_Widget_Item__c
      fields:
        Name: Share Your Story
        Widget__c:
          reference: UST_Portal_Widget__c
        Sort_Order__c: 60
        Card_Text__c: Tell fellow Tommies what you have been up to.
        Link_URL__c: /

