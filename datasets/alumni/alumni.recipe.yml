  nickname: directory_lawalum
  fields:
    Name: Morgan Lawalum
    First_Name_Text__c: Morgan
    Last_Name_Text__c: Lawalum
    Nickname__c: Mo
    Contact__c:
      reference: contact_lawalum
    Class_Year_Text__c: "1985"
    Employer_Text__c: Lakeside Legal Group
    Occupation_Text__c: Partner
    City_State__c: Saint Paul, MN
    Class_Year__c: "1985"
    St_Thomas_Connection__c: Alumni;Donor
