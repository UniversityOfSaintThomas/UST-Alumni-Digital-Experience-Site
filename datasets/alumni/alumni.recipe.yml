# ---- smp3: parent only (sparse directory record) --------------------------------------------------------
- object: Contact
  nickname: contact_parent
  fields:
    FirstName: Casey
    LastName: Parent
    Email: casey.parent@example.com
    University_Banner_ID__c: "90000003"
    Primary_University_Relationship__c: Parent
    St_Thomas_Connection__c: Parent
    Alumni_Directory_Record__c:
      reference: directory_parent

- object: Alumni_Directory__c
  nickname: directory_parent
  fields:
    Name: Casey Parent
    First_Name_Text__c: Casey
    Last_Name_Text__c: Parent
    Contact__c:
      reference: contact_parent
    St_Thomas_Connection__c: Parent


# ---- smp4: portal user with NO Alumni Directory record (data tags must fall back, no filters resolve) ----
- object: Contact
  nickname: contact_nodirectory
  fields:
    FirstName: Riley
    LastName: Nodirectory
    Email: riley.nodirectory@example.com
    University_Banner_ID__c: "90000004"
    Primary_University_Relationship__c: Alumna/us


# =========================================================================================================
# 2. MORE ALUMNI (no portal user) so the Alumni Directory has people to search and filter. Fixed lists keep
#    the data identical on every load.
# =========================================================================================================
- object: Contact
  count: 12
  nickname: contact_directory_only
  fields:
    FirstName: ${{ ['Avery','Blake','Cameron','Dakota','Emerson','Finley','Harper','Jamie','Kendall','Logan','Parker','Quinn'][child_index] }}
    LastName: ${{ ['Alder','Bishop','Carver','Dunmore','Ellery','Fairbanks','Garrity','Holloway','Ingram','Jessup','Kowalski','Lindqvist'][child_index] }}
    Email: sample.alum${{ child_index + 1 }}@example.com
    University_Banner_ID__c: ${{ 90000100 + child_index }}
    Preferred_Class_Year__c: ${{ ['1962','1975','1988','1994','2001','2005','2009','2013','2016','2019','2022','2024'][child_index] }}
    Primary_University_Relationship__c: Alumna/us
    St_Thomas_Connection__c: Alumni
    Employer__c: ${{ ['Retired','Cedar Health','Summit Realty','Northfield Schools','Bluestem Bank','Granite Engineering','Harbor Nonprofit','Prairie Media','Oak Street Law','Maple Software','Riverbend Dental','Evergreen Labs'][child_index] }}
    Job_Title__c: ${{ ['Retired','Nurse Practitioner','Broker','Principal','Loan Officer','Civil Engineer','Program Director','Producer','Attorney','Developer','Dentist','Researcher'][child_index] }}
  friends:
    - object: Alumni_Directory__c
      fields:
        Name: ${{ contact_directory_only.FirstName }} ${{ contact_directory_only.LastName }}
        First_Name_Text__c: ${{ contact_directory_only.FirstName }}
        Last_Name_Text__c: ${{ contact_directory_only.LastName }}
        Contact__c:
          reference: contact_directory_only
        Class_Year_Text__c: ${{ contact_directory_only.Preferred_Class_Year__c }}
        Employer_Text__c: ${{ contact_directory_only.Employer__c }}
        Occupation_Text__c: ${{ contact_directory_only.Job_Title__c }}
        City_State__c: ${{ ['Saint Paul, MN','Minneapolis, MN','Edina, MN','Duluth, MN','Madison, WI','Chicago, IL','Denver, CO','Seattle, WA','Phoenix, AZ','Austin, TX','Boston, MA','Atlanta, GA'][contact_directory_only.University_Banner_ID__c | int - 90000100] }}
        Class_Year__c: ${{ contact_directory_only.Preferred_Class_Year__c }}
        St_Thomas_Connection__c: Alumni
