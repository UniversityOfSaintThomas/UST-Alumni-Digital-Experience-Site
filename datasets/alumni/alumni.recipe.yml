# Sample alumni for scratch orgs ("alumni" dataset; also included by the "dev" dataset).
#
#   cci task run load_sample_data --dataset alumni --org dev
#   cci task run create_sample_portal_users --org dev      # then the four portal users (config_dev step 91)
#   cci task run link_sample_portal_users --org dev        # then link them back to Contact and Directory (step 92)
#
# This recipe creates the PEOPLE: 16 Contacts and 15 Alumni Directory records (EDA adds an Administrative Account for
# each Contact). It cannot create the portal USERS: CumulusCI's data loader insists on all 119 platform-defaulted User
# checkboxes. datasets/alumni/create_portal_users.apex does that instead, and also assigns the Alumni_Community
# permission set. The users are tied to these Contacts by Banner ID:
#
#    smp1  Jordan Newgrad      90000001  class 2021, alumni, young-alumni sender key        -> "recent grad" widgets
#    smp2  Morgan Lawalum      90000002  class 1985, alumni + donor, volunteer, Location 1  -> donor/volunteer/geo widgets
#    smp3  Casey Parent        90000003  parent only, almost nothing filled in              -> "parent" widgets
#    smp4  Riley Nodirectory   90000004  portal user whose Contact has NO Alumni Directory  -> empty-filter path
#    90000100-90000111         twelve more alumni with no user, so the directory has people to search
#
# LOAD THE PEOPLE AND USERS ONCE PER ORG. A Contact that has a portal user cannot be deleted and usernames are
# permanent, so there is no reset: delete the scratch org (cci org scratch_delete dev) and build a new one. Widgets
# are different: see datasets/widgets/widgets.recipe.yml, which can be reset and reloaded.
#
# Sign in as a sample user from the admin user: Setup > Users > (user) > Login, or "Log in to Experience as User".
# No passwords are stored anywhere and no emails are sent.
#
# Why no real colleges, degrees, or sports? In this repo the School_College, Degree_Types, Varsity_Sports and
# Academic_Majors value sets keep every real value INACTIVE (only "Placeholder" is valid), and the fields are
# restricted, so a real value cannot be loaded. These people use the live value sets (Class Year, St Thomas
# Connection, Volunteer Status, Geo Locations, Sender Key, Event Location) and "Placeholder" for the rest.
# If those value sets are ever activated, add real values here.
#
# =========================================================================================================
# 1. THE FOUR PERSONAS (the Contacts that get portal users). EDA creates each Administrative Account; the admin
#    (role: Alumni Community Owner) owns it, which Experience Cloud requires for portal users.
#
#    smp1  Jordan Newgrad      class 2021, alumni, young-alumni sender key                -> "recent grad" widgets
#    smp2  Morgan Lawalum      class 1985, alumni + donor, volunteer, Location 1          -> donor/volunteer/geo widgets
#    smp3  Casey Parent        parent only, nothing else filled in                        -> "parent" widgets
#    smp4  Riley Nodirectory   portal user whose Contact has NO Alumni Directory record   -> empty-filter path
# =========================================================================================================

# ---- smp1: recent graduate -------------------------------------------------------------------------------
- object: Contact
  nickname: contact_newgrad
  fields:
    FirstName: Jordan
    LastName: Newgrad
    Email: jordan.newgrad@example.com
    University_Banner_ID__c: "90000001"
    Preferred_Class_Year__c: "2021"
    Primary_University_Relationship__c: Alumna/us
    St_Thomas_Connection__c: Alumni
    Employer__c: North Star Analytics
    Job_Title__c: Data Analyst
    Alumni_Directory_Record__c:
      reference: directory_newgrad

- object: Alumni_Directory__c
  nickname: directory_newgrad
  fields:
    Name: Jordan Newgrad
    First_Name_Text__c: Jordan
    Last_Name_Text__c: Newgrad
    Contact__c:
      reference: contact_newgrad
    Class_Year_Text__c: "2021"
    Employer_Text__c: North Star Analytics
    Occupation_Text__c: Data Analyst
    City_State__c: Minneapolis, MN
    Class_Year__c: "2021"
    St_Thomas_Connection__c: Alumni
    Content_Sender_Keys__c: UDAR_YoungAlumni
    Event_Location_Type_s__c: Online;Minneapolis


