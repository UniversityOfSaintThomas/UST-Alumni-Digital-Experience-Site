# The "dev" dataset: loaded automatically by the last step of config_dev (load_sample_data), so every new dev
# scratch org starts with sample widgets and sample alumni.
#
#   cci task run load_sample_data --org dev
#
# It only includes the two smaller datasets, which can also be loaded on their own:
#   datasets/alumni/alumni.recipe.yml   16 contacts + 15 directory records (the four portal users are made by
#                                       the cci tasks create_sample_portal_users and link_sample_portal_users)
#   datasets/widgets/widgets.recipe.yml 16 "[Sample]" widgets (reset with delete_sample_widgets, then reload)

- include_file: ../alumni/alumni.recipe.yml
- include_file: ../widgets/widgets.recipe.yml
