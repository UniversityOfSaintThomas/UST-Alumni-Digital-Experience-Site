<template>
    <lightning-record-edit-form
        object-api-name={objectApiName}
        record-id={recordId}
        onload={handleLoad}
        onsubmit={handleSubmit}
        onsuccess={handleSuccess}
        onerror={handleError}>

        <lightning-messages></lightning-messages>

        <!-- Buttons_JSON__c is edited by the button editor, not by this form. This hidden input exists only
             so the form requests the field when it loads the record (it is not on the page layout, and
             lightning-record-edit-form returns only fields it is asked for). -->
        <lightning-input-field class="slds-hide" field-name="Buttons_JSON__c" variant="label-hidden" aria-hidden="true" tabindex="-1"></lightning-input-field>

        <!-- Widget Setup -->
        <section class="ust-section" aria-labelledby="ust-setup-heading">
            <h2 id="ust-setup-heading" class="ust-section-title">Widget Setup</h2>
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-input-field field-name="Name"></lightning-input-field>
                    <lightning-input-field field-name="Component_Name__c" onchange={handleComponentChange}></lightning-input-field>
                    <lightning-input-field field-name="Zone__c" onchange={handleZoneChange}></lightning-input-field>
                    <!-- value before zone: the picker applies props in order, and a zone change prunes the selection -->
                    <c-ust-page-context-picker
                        value={pageContext}
                        zone={zone}
                        onchange={handlePageContextChange}>
                    </c-ust-page-context-picker>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-input-field field-name="Is_Active__c"></lightning-input-field>
                    <lightning-input-field field-name="Sort_Order__c"></lightning-input-field>
                    <lightning-input-field field-name="Description__c"></lightning-input-field>
                </div>
            </div>
        </section>

        <!-- Content: headline, panel style, and body text. Always the card right below Widget Setup. -->
        <template lwc:if={showContentSection}>
            <section class="ust-section" aria-labelledby="ust-content-heading">
                <h2 id="ust-content-heading" class="ust-section-title">Content</h2>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <c-ust-data-tag-input
                            label={headerLabel}
                            value={contentHeader}
                            tag-definitions={dataTags}
                            onchange={handleHeaderChange}>
                        </c-ust-data-tag-input>
                    </div>
                    <template lwc:if={showPanelStyle}>
                        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <lightning-input-field field-name="Content_CSS_Class__c" onchange={handleClassChange}></lightning-input-field>
                        </div>
                    </template>
                </div>
                <template lwc:if={showPanelStyle}>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <lightning-input-field field-name="Section_Background__c" onchange={handleBackgroundChange}></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <lightning-input-field field-name="Section_Accent__c" onchange={handleAccentChange}></lightning-input-field>
                        </div>
                    </div>
                </template>
                <c-ust-rich-text-editor
                    label={bodyLabel}
                    value={staticContent}
                    tag-definitions={dataTags}
                    onchange={handleEditorChange}>
                </c-ust-rich-text-editor>
            </section>

            <!-- Call-to-action buttons -->
            <section class="ust-section" aria-labelledby="ust-buttons-card-heading">
                <h2 id="ust-buttons-card-heading" class="ust-section-title">Call-to-action buttons</h2>
                <c-ust-widget-button-editor
                    value={buttonsJson}
                    tag-definitions={dataTags}
                    button-layout={effectiveButtonLayout}
                    disabled={isSaving}
                    onchange={handleButtonsChange}>
                </c-ust-widget-button-editor>
                <template lwc:if={showPanelStyle}>
                    <div class="slds-m-top_small">
                        <lightning-input-field field-name="Button_Layout__c" onchange={handleLayoutChange}></lightning-input-field>
                    </div>
                </template>
                <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input-field field-name="Button_Placement__c" onchange={handlePlacementChange}></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input-field field-name="Button_Size__c" onchange={handleSizeChange}></lightning-input-field>
                    </div>
                </div>
            </section>
        </template>

        <!-- Hero Banner: pictures and look (Hero Banner widgets only) -->
        <template lwc:if={showHeroSection}>
            <section class="ust-section" aria-labelledby="ust-hero-heading">
                <h2 id="ust-hero-heading" class="ust-section-title">Hero Banner</h2>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                    Pictures upload as soon as you choose them and are not part of Save or Reset.
                    The headline, text, and buttons are set in the Content section below.
                </p>

                <template lwc:if={hasRecord}>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <h3 class="slds-text-title_caps slds-m-bottom_xx-small">Desktop picture</h3>
                            <p class="slds-text-body_small slds-text-color_weak">Cropped to 1600 x 600. JPG, PNG, or GIF.</p>
                            <c-aws-s3-directory-image
                                record-id={recordId}
                                image-field={desktopImage.field}
                                file-name-suffix={desktopImage.suffix}
                                image-max-width={desktopImage.width}
                                image-max-height={desktopImage.height}
                                image-mode="crop">
                            </c-aws-s3-directory-image>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <h3 class="slds-text-title_caps slds-m-bottom_xx-small">Mobile picture (optional)</h3>
                            <p class="slds-text-body_small slds-text-color_weak">Used on phones. Cropped to 800 x 640. Without it the desktop picture is used.</p>
                            <c-aws-s3-directory-image
                                record-id={recordId}
                                image-field={mobileImage.field}
                                file-name-suffix={mobileImage.suffix}
                                image-max-width={mobileImage.width}
                                image-max-height={mobileImage.height}
                                image-mode="crop">
                            </c-aws-s3-directory-image>
                        </div>
                    </div>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_regular ust-hero-note" role="status">
                        Save the widget first, then come back to upload the pictures.
                    </p>
                </template>

                <div class="slds-m-top_small">
                    <lightning-input-field field-name="Hero_Alt_Text__c" onchange={handleHeroAltChange}></lightning-input-field>
                    <template lwc:if={missingAltText}>
                        <p class="slds-text-body_small ust-hero-warning" role="alert">
                            Describe the picture for people who cannot see it. Alt text is required before you can save.
                        </p>
                    </template>
                </div>

                <div class="slds-grid slds-wrap slds-gutters slds-m-top_x-small">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-4">
                        <lightning-input-field field-name="Hero_Layout__c" onchange={handleHeroLayoutChange}></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-4">
                        <lightning-input-field field-name="Hero_Height__c" onchange={handleHeroHeightChange}></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-4">
                        <lightning-input-field field-name="Hero_Text_Position__c" onchange={handleHeroPositionChange}></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-4">
                        <lightning-input-field field-name="Hero_Overlay__c" onchange={handleHeroOverlayChange}></lightning-input-field>
                    </div>
                </div>
                <template lwc:if={heroIsSplit}>
                    <p class="slds-text-body_small slds-m-top_x-small ust-hero-hint">
                        Split layout: the text is always on the left on a dark purple band, so Text position and Overlay are not used.
                    </p>
                </template>
            </section>
        </template>

        <!-- Cards: grid settings and the cards (Card Grid widgets only) -->
        <template lwc:if={showCardsSection}>
            <section class="ust-section" aria-labelledby="ust-cards-heading">
                <h2 id="ust-cards-heading" class="ust-section-title">Cards</h2>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                    Cards save on their own as soon as you save them here; they are not part of this page's Save or Reset.
                    The heading, text, and buttons are set in the Content section above.
                </p>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input-field field-name="Grid_Columns__c" onchange={handleColumnsChange}></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input-field field-name="Card_Bottom_Bar__c" onchange={handleBarChange}></lightning-input-field>
                    </div>
                </div>
                <c-ust-widget-item-editor
                    widget-id={recordId}
                    disabled={isSaving}
                    onitemschange={handleItemsChange}>
                </c-ust-widget-item-editor>
            </section>
        </template>

        <!-- Preview: always the card right above Audience Filters. -->
        <template lwc:if={showContentSection}>
            <section class="ust-section" aria-labelledby="ust-preview-heading">
                <h2 id="ust-preview-heading" class="ust-section-title">Preview</h2>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">As shown on the portal.</p>
                <template lwc:if={hasTagsInContent}>
                    <lightning-input
                        type="checkbox"
                        label="Preview as a guest (no personal data, fallbacks only)"
                        checked={previewAsGuest}
                        onchange={handlePreviewAsGuestChange}>
                    </lightning-input>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                        Data tags show sample values here. Signed-in alumni see their own information.
                    </p>
                </template>
                <template lwc:if={isHero}>
                    <div class="ust-preview-hero">
                        <c-ust-hero-banner
                            hero={previewHero}
                            rich-text-content={previewContent}
                            text-header={previewHeader}
                            buttons={previewButtons}
                            button-placement={buttonPlacement}
                            button-size={buttonSize}
                            preview-mode>
                        </c-ust-hero-banner>
                    </div>
                </template>
                <template lwc:elseif={isCardGrid}>
                    <div class="ust-preview-body">
                        <c-ust-card-grid
                            grid={gridPreview}
                            rich-text-content={previewContent}
                            text-header={previewHeader}
                            content-class={contentClass}
                            section-background={sectionBackground}
                            section-accent={sectionAccent}
                            buttons={previewButtons}
                            button-placement={buttonPlacement}
                            button-size={buttonSize}
                            button-layout={buttonLayout}
                            preview-mode>
                        </c-ust-card-grid>
                    </div>
                </template>
                <template lwc:else>
                    <div class="ust-preview-body">
                        <c-ust-static-content
                            rich-text-content={previewContent}
                            text-header={previewHeader}
                            content-class={contentClass}
                            section-background={sectionBackground}
                            section-accent={sectionAccent}
                            buttons={previewButtons}
                            button-placement={buttonPlacement}
                            button-size={buttonSize}
                            button-layout={buttonLayout}
                            preview-mode>
                        </c-ust-static-content>
                    </div>
                </template>
            </section>
        </template>

        <!-- Audience Filters -->
        <section class="ust-section" aria-labelledby="ust-filters-heading">
            <h2 id="ust-filters-heading" class="ust-section-title">Audience Filters</h2>
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                Leave a filter blank to show the widget to everyone for that dimension.
            </p>
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-input-field field-name="Filter_College__c"></lightning-input-field>
                    <lightning-input-field field-name="Filter_Degree_Level__c"></lightning-input-field>
                    <lightning-input-field field-name="Filter_Class_Year__c"></lightning-input-field>
                    <lightning-input-field field-name="Filter_Academic_Majors__c"></lightning-input-field>
                    <lightning-input-field field-name="Filter_St_Thomas_Connection__c"></lightning-input-field>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-input-field field-name="Filter_Athletic_Affiliation__c"></lightning-input-field>
                    <lightning-input-field field-name="Filter_Event_Location_Type__c"></lightning-input-field>
                    <lightning-input-field field-name="Filter_Geo_Location__c"></lightning-input-field>
                    <lightning-input-field field-name="Filter_Content_Sender_Key__c"></lightning-input-field>
                    <lightning-input-field field-name="Filter_Volunteer_Status__c"></lightning-input-field>
                </div>
            </div>
        </section>

        <div class="ust-actions slds-grid slds-grid_align-end slds-m-top_medium">
            <lightning-button class="slds-m-right_x-small" label="Reset" onclick={handleReset} disabled={isSaving}></lightning-button>
            <lightning-button type="submit" variant="brand" label="Save" disabled={isSaving}></lightning-button>
        </div>
    </lightning-record-edit-form>
</template>
