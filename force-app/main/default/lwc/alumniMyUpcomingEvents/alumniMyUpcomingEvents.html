<!-- Alumni My Upcoming Events -->
<template>
    <template lwc:if={shouldRender}>
        <div class="alumni-event-listings">
            <div class="alumni-event-listings-header-row">
                <h2 class="alumni-event-listings-header slds-m-bottom_small"><b>Upcoming Events For You</b></h2>
                <template lwc:if={decoratedUpcomingEvents.length}>
                    <button
                            type="button"
                            class="alumni-event-listings-toggle-all"
                            aria-expanded={allExpanded}
                            onclick={handleToggleAllDates}>
                        {toggleAllLabel}
                    </button>
                </template>
            </div>
            <ul class="slds-has-dividers_top-space alumni-event-listings-list">
                <template for:each={decoratedUpcomingEvents} for:item="upcomingEvent">
                    <li key={upcomingEvent.eventId}
                        class="alumni-event-listings-row"
                        data-id={upcomingEvent.eventId}
                        tabindex="0"
                        onmouseenter={handleRowActivate}
                        onmouseleave={handleRowDeactivate}
                        onfocus={handleRowActivate}
                        onblur={handleRowDeactivate}>
                        <div class="alumni-event-listings-row-content">
                            <div class="slds-grid slds-nowrap alumni-event-listings-date-line">
                                <span class="slds-col slds-no-flex slds-shrink-none alumni-event-listings-row-number">
                                    {upcomingEvent.rowNumber}.
                                </span>
                                <span class="slds-truncate alumni-event-listings-title">
                                    {upcomingEvent.eventTitle}
                                </span>
                            </div>
                            <button
                                    type="button"
                                    class="alumni-event-listings-toggle-dates"
                                    data-id={upcomingEvent.eventId}
                                    aria-expanded={upcomingEvent.isExpanded}
                                    onclick={handleToggleDates}>
                                <span>{upcomingEvent.toggleLabel}</span>
                            </button>
                            <template lwc:if={upcomingEvent.isExpanded}>
                                <ul class="alumni-event-listings-instances">
                                    <template for:each={upcomingEvent.decoratedInstances} for:item="instance">
                                        <li key={instance.instanceId} class="alumni-event-listings-instance-row">
                                            <span class="alumni-event-listings-instance-date">
                                                {instance.formattedStartDate}
                                                <template lwc:if={instance.startTime}>
                                                    , {instance.startTime}
                                                </template>
                                            </span>
                                            <template lwc:if={instance.registeredStatus}>
                                                <span class="alumni-event-listings-register-link">Already registered</span>
                                            </template>
                                            <template lwc:elseif={instance.registrationLink}>
                                                <span class="alumni-event-listings-register-link">
                                                    <a href={instance.registrationLink} target="_blank" rel="noopener noreferrer">Register</a>
                                                </span>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                        </div>

                        <!-- Hover/focus-triggered event description tooltip -->
                        <template lwc:if={upcomingEvent.isActive}>
                            <div class={upcomingEvent.popoverClass} role="tooltip">
                                <div class="alumni-event-listings-popover-content">
                                    <div class="slds-popover__body">
                                        <h3 class="slds-text-heading_small alumni-event-listings-popover-title">{upcomingEvent.eventTitle}</h3>
                                        <template lwc:if={upcomingEvent.plainDescription}>
                                            <p class="alumni-event-listings-popover-description-label">Description:</p>
                                            <p>{upcomingEvent.plainDescription}</p>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </li>
                </template>
            </ul>

            <template lwc:if={showWindowControls}>
                <div class="alumni-event-listings-window-controls">
                    <button
                            type="button"
                            class="alumni-event-listings-window-link"
                            disabled={isAtWindowStart}
                            onclick={handleWindowUp}>
                        <lightning-icon icon-name="utility:chevronup" size="x-small" class="alumni-event-listings-window-link-icon alumni-event-listings-window-link-icon_up"></lightning-icon>
                        <span>Up</span>
                    </button>
                    <span class="alumni-event-listings-window-separator">|</span>
                    <button
                            type="button"
                            class="alumni-event-listings-window-link"
                            disabled={isAtWindowEnd}
                            onclick={handleWindowDown}>
                        <span>Down</span>
                        <lightning-icon icon-name="utility:chevrondown" size="x-small" class="alumni-event-listings-window-link-icon"></lightning-icon>
                    </button>
                </div>
                <div class="alumni-event-listings-total">{totalEventsLabel}</div>
            </template>
        </div>
    </template>
</template>
