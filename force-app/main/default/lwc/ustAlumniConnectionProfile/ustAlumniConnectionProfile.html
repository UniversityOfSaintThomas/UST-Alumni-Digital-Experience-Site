<template>
    <div class="slds-card ust-alumni-connection-profile">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading connection" size="medium"></lightning-spinner>
        </template>

        <template lwc:if={errorMessage}>
            <div class="slds-text-color_error slds-p-around_small" role="alert">{errorMessage}</div>
        </template>

        <template lwc:if={showPromptState}>
            <div class="slds-p-around_medium slds-text-color_weak">
                Select an alum from the directory, news, or business listings to see how they're
                connected to the St. Thomas community.
            </div>
        </template>

        <template lwc:if={showEmptyState}>
            <div class="slds-p-around_medium slds-text-color_weak">
                No public alumni profile is available for this selection.
            </div>
        </template>

        <template lwc:if={hasProfile}>
            <div class="slds-p-around_medium profile-header">
                <div>
                    <h1 class="slds-text-heading_medium">{displayFirstName} {displayLastName}</h1>
                    <div class="slds-grid slds-wrap slds-gutters profile-fields">
                        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-3 slds-p-bottom_small">
                            <p class="slds-text-title_caps">Class Year</p>
                            <p>{profile.classYearText}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-3 slds-p-bottom_small">
                            <p class="slds-text-title_caps">St. Thomas Degree</p>
                            <p>{profile.stThomasDegreeText}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-3 slds-p-bottom_small">
                            <p class="slds-text-title_caps">City, State</p>
                            <p>{profile.cityState}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-3 slds-p-bottom_small">
                            <p class="slds-text-title_caps">Job Title</p>
                            <p>{profile.occupationText}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-3 slds-p-bottom_small">
                            <p class="slds-text-title_caps">Employer</p>
                            <p>{profile.employerText}</p>
                        </div>
                    </div>
                </div>
                <c-ust-favorite-toggle target-type="Alumni_Directory" target-record-id={profile.alumniDirectoryId}></c-ust-favorite-toggle>
            </div>

            <template lwc:if={hasNewsItems}>
                <div class="slds-p-around_medium connection-section">
                    <h2 class="slds-text-heading_small slds-m-bottom_small">Alumni News</h2>
                    <ul>
                        <template for:each={newsItems} for:item="newsItem">
                            <li key={newsItem.Id} class="slds-p-vertical_x-small news-item">
                                <p class="slds-text-title_caps">{newsItem.Category__c}</p>
                                <lightning-formatted-rich-text value={newsItem.Alumni_News__c}></lightning-formatted-rich-text>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>

            <template lwc:if={hasBusinessListings}>
                <div class="slds-p-around_medium connection-section">
                    <h2 class="slds-text-heading_small slds-m-bottom_small">Business Directory</h2>
                    <ul>
                        <template for:each={businessListings} for:item="listing">
                            <li key={listing.Id} class="slds-p-vertical_x-small business-item">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <div class="slds-col">
                                        <div class="slds-text-heading_small">{listing.Company_Name__c}</div>
                                        <div>{listing.Title__c}</div>
                                        <div>{listing.Company_City__c}, {listing.Company_State__c}</div>
                                        <template lwc:if={listing.Company_Website__c}>
                                            <a href={listing.Company_Website__c} target="_blank" rel="noopener noreferrer">
                                                {listing.Company_Website__c}
                                            </a>
                                        </template>
                                    </div>
                                    <div class="slds-col slds-no-flex">
                                        <c-ust-favorite-toggle target-type="Professional_Directory" target-record-id={listing.Id}></c-ust-favorite-toggle>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>
        </template>
    </div>
</template>
