<template>
    <template lwc:if={isEmpty}></template>
    <template lwc:elseif={isSplit}>
        <!-- Split: text on a dark band, the picture beside it. The rings are decoration only. -->
        <div class={bannerClass}>
            <div class="ust-hero-rings" aria-hidden="true"></div>
            <div class="ust-hero-split">
                <div class="ust-hero-split-text">
                    <c-ust-static-content
                        rich-text-content={richTextContent}
                        text-header={textHeader}
                        buttons={alignedButtons}
                        button-placement={buttonPlacement}
                        button-size={buttonSize}
                        preview-mode={previewMode}
                        dark-background
                        large-heading>
                    </c-ust-static-content>
                </div>
                <template lwc:if={showImage}>
                    <picture class="ust-hero-split-picture">
                        <template lwc:if={hasMobileImage}>
                            <source media={mobileMedia} srcset={settings.mobileImageUrl}>
                        </template>
                        <img
                            class="ust-hero-split-image"
                            src={settings.imageUrl}
                            alt={altText}
                            decoding="async"
                            onerror={handleImageError}>
                    </picture>
                </template>
            </div>
        </div>
    </template>
    <template lwc:else>
        <div class={bannerClass}>
            <template lwc:if={showImage}>
                <picture class="ust-hero-picture">
                    <template lwc:if={hasMobileImage}>
                        <source media={mobileMedia} srcset={settings.mobileImageUrl}>
                    </template>
                    <img
                        class="ust-hero-image"
                        src={settings.imageUrl}
                        alt={altText}
                        decoding="async"
                        onerror={handleImageError}>
                </picture>
            </template>
            <template lwc:if={hasScrim}>
                <div class={scrimClass}></div>
            </template>
            <div class="ust-hero-content">
                <c-ust-static-content
                    rich-text-content={richTextContent}
                    text-header={textHeader}
                    buttons={alignedButtons}
                    button-placement={buttonPlacement}
                    button-size={buttonSize}
                    preview-mode={previewMode}
                    over-image
                    large-heading>
                </c-ust-static-content>
            </div>
        </div>
    </template>
</template>
