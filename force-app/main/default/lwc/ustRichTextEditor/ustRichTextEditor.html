<template>
    <div class="ust-editor">
        <div class="ust-editor-label slds-form-element__label">{label}</div>

        <div class="ust-editor-controls slds-m-bottom_x-small">
            <div class="ust-editor-style">
                <lightning-combobox
                    name="paragraphStyle"
                    label="Paragraph style"
                    value={selectedStyle}
                    options={styleOptions}
                    disabled={disabled}
                    onchange={handleStyleChange}>
                </lightning-combobox>
            </div>
            <template lwc:if={hasDataTags}>
                <div class="ust-editor-tag">
                    <lightning-combobox
                        name="insertTag"
                        label="Insert data tag"
                        placeholder="Choose a tag..."
                        options={tagOptions}
                        disabled={disabled}
                        onchange={handleInsertTag}>
                    </lightning-combobox>
                </div>
            </template>
        </div>

        <!-- Cursor-tracking handlers live here, not on the outer wrapper (getFormat() focuses
             the editor, which would close the dropdown above). Toolbar clicks pause tracking
             so the Link and Image dialogs are not interrupted. -->
        <div class="ust-editor-body" onclick={handleEditorClick} onkeyup={handleEditorKeyup}>
            <lightning-input-rich-text
                label={label}
                value={value}
                formats={formats}
                disabled-categories={disabledCategories}
                disabled={disabled}
                valid={isValid}
                onchange={handleEditorChange}>
            </lightning-input-rich-text>
        </div>

        <div class="slds-m-top_xx-small slds-grid slds-grid_align-spread">
            <div class="slds-col">
                <template lwc:if={hasUnknownTags}>
                    <p class="slds-text-body_small ust-editor-warning" role="alert">
                        Unknown data tag: {unknownTagsText}. Pick tags from the Insert data tag list.
                    </p>
                </template>
                <template lwc:if={hasDisallowedHeadings}>
                    <p class="slds-text-body_small slds-text-color_error" role="alert">
                        Heading 1 and Heading 6 are not used on the portal. Change them to Heading 2-5.
                    </p>
                </template>
                <template lwc:if={isOverLimit}>
                    <p class="slds-text-body_small slds-text-color_error" role="alert">
                        Content is too long. Shorten it to fit within {maxLength} characters.
                    </p>
                </template>
            </div>
            <div class="slds-col slds-no-flex">
                <span class={counterClass}>{counterText}</span>
            </div>
        </div>
    </div>
</template>
