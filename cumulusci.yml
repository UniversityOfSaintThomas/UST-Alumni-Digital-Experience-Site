minimum_cumulusci_version: '4.8.0'
project:
    name: UST-Alumni-Digital-Experience-Site
    package:
        name: UST-Alumni-Digital-Experience-Site
        api_version: '68.0'
    git:
    source_format: sfdx
    dependencies:
        - github: https://github.com/UniversityOfSaintThomas/Salesforce-LWC-S3-Integration

tasks:
    robot:
        options:
            suites: robot/UST-Alumni-Digital-Experience-Site/tests
            options:
                outputdir: robot/UST-Alumni-Digital-Experience-Site/results

    robot_testdoc:
        options:
            path: robot/UST-Alumni-Digital-Experience-Site/tests
            output: robot/UST-Alumni-Digital-Experience-Site/doc/UST-Alumni-Digital-Experience-Site_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 75

    create_community:
        description: Deploys configuration for Development.
        class_path: cumulusci.tasks.salesforce.CreateCommunity
        options:
            name: Alumni
            description: St Thomas Alumni Community
            template: Build Your Own (LWR)
            url_path_prefix: alumni
            skip_existing: True

    create_community_network:
        description: Creates the community network for Development.
        class_path: cumulusci.tasks.salesforce.network_member_group.CreateNetworkMemberGroups
        options:
            network_name: Alumni
            profile_names:
                - Customer Community Login User

    create_community_publish:
        description: Publishes the community for Development.
        class_path: cumulusci.tasks.salesforce.PublishCommunity
        options:
            name: Alumni

    create_community_experience_cloud_bundle:
        description: Deploys Network config for community for Development.
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            namespace_inject: $project_config.project__package__namespace
            path: unpackaged/config/experiences
            unmanaged: True
            timeout: 520
            source_format: sfdx

    create_community_navigation:
        description: Deploys the default navigation menu for the community.
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            namespace_inject: $project_config.project__package__namespace
            path: unpackaged/config/navigationMenus
            unmanaged: True

    sync_navigation_menu:
        description: >-
            Rewrites the theme layout's Default Navigation menu binding to match
            this org's actual auto-generated NavigationLinkSet DeveloperName,
            since Salesforce assigns it non-deterministically per org and won't
            allow the Default Navigation menu to be renamed.
        class_path: tasks.sync_navigation_menu.SyncNavigationMenuBinding
        options:
            network_name: Alumni
            content_path: unpackaged/config/experiences/digitalExperiences/site/Alumni1/sfdc_cms__themeLayout/scopedHeaderAndFooter/content.json

    role_to_userUser:
        description: Give Guest User Registrant Permission Set
        class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
        options:
            namespace_inject: $project_config.project__package__namespace
            apex: >
                User userUser = [SELECT Id FROM User WHERE Alias = 'UUser' LIMIT 1];
                Id seaUserRole = [SELECT Id FROM UserRole WHERE Name = 'Alumni Community Owner'].Id;
                userUser.UserRoleId = seaUserRole;
                userUser.Country = 'United States';
                update userUser;

    assign_aws_s3_directory_image_permset:
        description: >-
            Assigns the AWS_S3_Directory_Image permission set (from the
            Salesforce-LWC-S3-Integration dependency) to System Administrators
            so they can use the awsS3DirectoryImage LWC out of the box.
        class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
        options:
            namespace_inject: $project_config.project__package__namespace
            apex: >
                PermissionSet ps = [SELECT Id FROM PermissionSet WHERE Name = 'AWS_S3_Directory_Image' LIMIT 1];
                List<PermissionSetAssignment> assignments = new List<PermissionSetAssignment>();
                for (User u : [SELECT Id FROM User WHERE Profile.Name = 'System Administrator']) {
                    assignments.add(new PermissionSetAssignment(PermissionSetId = ps.Id, AssigneeId = u.Id));
                }
                if (!assignments.isEmpty()) {
                    upsert assignments;
                }

    assign_ust_portal_widget_admin_permset:
        description: >-
            Assigns the UST_Portal_Widget_Admin permission set to System Administrators so they can
            edit Portal Widgets and register zone placements from Experience Builder.
        class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
        options:
            namespace_inject: $project_config.project__package__namespace
            apex: >
                Id permSetId = [SELECT Id FROM PermissionSet WHERE Name = 'UST_Portal_Widget_Admin' LIMIT 1].Id;
                Set<Id> alreadyAssigned = new Set<Id>();
                for (PermissionSetAssignment existing : [SELECT AssigneeId FROM PermissionSetAssignment WHERE PermissionSetId = :permSetId]) {
                    alreadyAssigned.add(existing.AssigneeId);
                }
                List<PermissionSetAssignment> assignments = new List<PermissionSetAssignment>();
                for (User admin : [SELECT Id FROM User WHERE Profile.Name = 'System Administrator' AND IsActive = true]) {
                    if (!alreadyAssigned.contains(admin.Id)) {
                        assignments.add(new PermissionSetAssignment(PermissionSetId = permSetId, AssigneeId = admin.Id));
                    }
                }
                if (!assignments.isEmpty()) {
                    insert assignments;
                }

    seed_zone_placements:
        description: >-
            Seeds UST_Portal_Zone_Placement__c with the zones known from the site bundle (layout zones
            banner and above_footer, plus Home and Alumni Directory zones). Idempotent. Experience Builder
            registration corrects or extends it afterwards.
        class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
        options:
            namespace_inject: $project_config.project__package__namespace
            apex: >
                PortalPageRegistry.seedKnownPlacements();

    migrate_widget_page_context:
        description: >-
            One-time, idempotent data migration for existing Portal Widgets: replaces the legacy
            Page Context value directory with the real page API name alumni_directory__c. Run in
            every org that has widget records (for example eda-staging). The values giving, events,
            profile and news are intentionally left unchanged.
        class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
        options:
            namespace_inject: $project_config.project__package__namespace
            apex: >
                List<UST_Portal_Widget__c> widgets = [SELECT Id, Page_Context__c FROM UST_Portal_Widget__c WHERE Page_Context__c INCLUDES ('directory')];
                for (UST_Portal_Widget__c widget : widgets) {
                    List<String> migrated = new List<String>();
                    for (String pageValue : widget.Page_Context__c.split(';')) {
                        String mapped = pageValue == 'directory' ? 'alumni_directory__c' : pageValue;
                        if (!migrated.contains(mapped)) {
                            migrated.add(mapped);
                        }
                    }
                    widget.Page_Context__c = String.join(migrated, ';');
                }
                update widgets;
                System.debug('Migrated ' + widgets.size() + ' widget(s).');

flows:
    config_dev:
        steps:
            1.3:
                task: role_to_userUser
            1.4:
                task: assign_aws_s3_directory_image_permset
            1.5:
                task: assign_ust_portal_widget_admin_permset
            1.6:
                task: seed_zone_placements
            3:
                task: create_community
            4:
                task: create_community_network
            4.5:
                task: sync_navigation_menu
            5:
                task: create_community_experience_cloud_bundle
            5.5:
                task: create_community_navigation
            6:
                task: create_community_publish

orgs:
    scratch:
        dev:
            days: 14
            namespaced: false